# Shows the TestFlight processing / test group state of the latest builds.
name: testflight-status

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-6aeoeq]
    paths: [tools/asc_status.py, .github/workflows/testflight-status.yml]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: pip install --quiet pyjwt cryptography
      - run: python3 tools/asc_status.py
        env:
          BUNDLE_ID: com.seventhwell.seijitsuqr
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
