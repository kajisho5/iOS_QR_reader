# Applies appstore/listing.json to App Store Connect (tools/asc_listing.py).
name: asc-listing

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-6aeoeq]
    paths: [appstore/listing.json, tools/asc_listing.py, .github/workflows/asc-listing.yml]

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: pip install --quiet pyjwt cryptography
      - name: Apply the App Store listing
        working-directory: tools
        run: python3 asc_listing.py
        env:
          BUNDLE_ID: com.seventhwell.seijitsuqr
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
