name: SeijitsuQR
options:
  bundleIdPrefix: com.seventhwell
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The String Catalog is maintained by hand through tools/gen_l10n.py; do not auto-extract.
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  SeijitsuQR:
    type: application
    platform: iOS
    sources:
      - path: SeijitsuQR
      # Shared with the widget extension (the intent its control runs).
      - path: Shared
    dependencies:
      - target: SeijitsuQRWidgets
      - target: SeijitsuQRShare
    info:
      path: SeijitsuQR/Info.plist
      properties:
        CFBundleDisplayName: 誠実QRリーダー
        CFBundleName: 誠実QRリーダー
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Solid color only (no text, logo or animation): matches the first screen, the camera (HIG Launching).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SeijitsuSharedKeychainGroup: $(AppIdentifierPrefix)com.seventhwell.seijitsuqr.shared
        # Opened by the widget: seijitsuqr://pro (purchase screen), seijitsuqr://open.
        CFBundleURLTypes:
          - CFBundleURLName: com.seventhwell.seijitsuqr
            CFBundleURLSchemes: [seijitsuqr]
        NSCameraUsageDescription: QRコードとバーコードを読み取るためにカメラを使用します。読み取った内容が外部に送信されることはありません
        NSPhotoLibraryAddUsageDescription: 作成したQRコードの画像を写真ライブラリに保存するために使用します
        NSContactsUsageDescription: 読み取った連絡先を連絡先アプリに追加するために使用します
        NSLocationWhenInUseUsageDescription: 「地図の位置」のQRコードに現在地を入れるために使います。位置情報が外部に送信されることはありません
        NSFaceIDUsageDescription: 履歴のロックを解除するために Face ID を使います。顔のデータがアプリに渡ることはありません
    entitlements:
      path: SeijitsuQR/SeijitsuQR.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        # Shared with the widget extension (the favorites it shows; see Shared/WidgetSnapshot.swift).
        # The app's own group comes first, so its existing keychain items keep their default group.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.seventhwell.seijitsuqr
          - $(AppIdentifierPrefix)com.seventhwell.seijitsuqr.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.seijitsuqr
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # Widget extension: the "QRスキャン" control (iOS 18+); the home screen widgets come later (docs/DESIGN_1.1.md §3–4).
  SeijitsuQRWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SeijitsuQRWidgets
      - path: Shared
      # The widget draws the favorite code again from its content, with the app's own renderers.
      - path: SeijitsuQR/Core/Models/PayloadKind.swift
      - path: SeijitsuQR/Core/Encoding/CodeImageRenderer.swift
      - path: SeijitsuQR/Core/Encoding/LinearBarcodeEncoder.swift
      - path: SeijitsuQR/Core/Encoding/QRCodeRenderer.swift
      - path: SeijitsuQR/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: SeijitsuQRWidgets/SeijitsuQRWidgets.entitlements
      properties:
        # Shared with the app (the favorites the widget shows; see Shared/WidgetSnapshot.swift).
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.seventhwell.seijitsuqr.shared
    info:
      path: SeijitsuQRWidgets/Info.plist
      properties:
        CFBundleDisplayName: 誠実QRリーダー
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SeijitsuSharedKeychainGroup: $(AppIdentifierPrefix)com.seventhwell.seijitsuqr.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.seijitsuqr.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SUPPORTS_MACCATALYST: NO

  # Share extension: reads the codes in a shared image and shows them (docs/DESIGN_1.1.md §5, E).
  SeijitsuQRShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SeijitsuQRShare
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/PendingScans.swift
      - path: SeijitsuQR/Core/Models/PayloadKind.swift
      - path: SeijitsuQR/Core/Models/DetectedCode.swift
      - path: SeijitsuQR/Core/Parsing/ParsedPayload.swift
      - path: SeijitsuQR/Core/Parsing/PayloadParser.swift
      - path: SeijitsuQR/Core/Parsing/URLRiskAnalyzer.swift
      - path: SeijitsuQR/Features/Scan/ImageCodeReader.swift
      - path: SeijitsuQR/Core/Localization/L10n.swift
      - path: SeijitsuQR/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: SeijitsuQR/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: SeijitsuQRShare/Info.plist
      properties:
        CFBundleDisplayName: 誠実QRリーダー
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SeijitsuSharedKeychainGroup: $(AppIdentifierPrefix)com.seventhwell.seijitsuqr.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: SeijitsuQRShare/SeijitsuQRShare.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.seventhwell.seijitsuqr.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.seijitsuqr.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  SeijitsuQRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeijitsuQRTests
      # Lets SKTestSession load the Pro product in the App Store screenshot test.
      - path: StoreKit/Configuration.storekit
        buildPhase: resources
    dependencies:
      - target: SeijitsuQR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seventhwell.seijitsuqr.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SeijitsuQR:
    build:
      targets:
        SeijitsuQR: all
        SeijitsuQRTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Configuration.storekit
    test:
      config: Debug
      targets:
        - SeijitsuQRTests
