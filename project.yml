name: SeijitsuQR
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The String Catalog is maintained by hand through tools/gen_l10n.py; do not auto-extract.
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  SeijitsuQR:
    type: application
    platform: iOS
    sources:
      - path: SeijitsuQR
    info:
      path: SeijitsuQR/Info.plist
      properties:
        CFBundleDisplayName: 誠実QRリーダー
        CFBundleName: 誠実QRリーダー
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: QRコードとバーコードを読み取るためにカメラを使用します。読み取った内容が外部に送信されることはありません
        NSPhotoLibraryAddUsageDescription: 作成したQRコードの画像を写真ライブラリに保存するために使用します
        NSContactsUsageDescription: 読み取った連絡先を連絡先アプリに追加するために使用します
    entitlements:
      path: SeijitsuQR/SeijitsuQR.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seijitsuqr
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  SeijitsuQRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeijitsuQRTests
    dependencies:
      - target: SeijitsuQR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.seijitsuqr.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SeijitsuQR:
    build:
      targets:
        SeijitsuQR: all
        SeijitsuQRTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeijitsuQRTests
